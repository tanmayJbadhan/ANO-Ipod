; Jigglypuff - handheld music console on the LilyGo T-Display-S3-AMOLED-1.64.
; See README.md. To build and flash, run flash.bat (or flash.ps1).
;
; The firmware is split across folders by feature; this file stitches them
; into one program:
;   2_Firmware        main program + buttons, touch, battery   (src_dir)
;   3_Music_App       SD-card music player + PCM5122 DAC
;   4_Games           Lullaby Run racing game
;   5_Web_Uploader    WiFi song upload page + clock sync
;   6_Theme_Graphics  glass look, landscape screen, Jigglypuff art

[platformio]
boards_dir = ./boards
lib_dir = ./libraries
src_dir = 2_Firmware
default_envs = Jigglypuff

[env:Jigglypuff]
platform = espressif32 @6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
; PSRAM needs all three of these (memory type alone silently leaves it off).
board_build.memory_type = qio_opi
board_build.arduino.memory_type = qio_opi
board_build.boot = opi
board_build.partitions = 2_Firmware/partitions.csv
board_build.filesystem = littlefs
lib_ldf_mode = deep

build_flags =
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D BOARD_HAS_PSRAM
    ; every feature folder can include every other one's headers
    -I 2_Firmware
    -I 3_Music_App
    -I 4_Games
    -I 5_Web_Uploader
    -I 6_Theme_Graphics

build_src_filter =
    +<*>
    +<../3_Music_App/>
    +<../4_Games/>
    +<../5_Web_Uploader/>
    +<../6_Theme_Graphics/>

lib_deps =
    adafruit/Adafruit Seesaw Library @ ^1.7.7
    ; ESP32-audioI2S 3.0.0 lives in libraries/ESP32-audioI2S, patched for
    ; bit-exact output (see JIGGLYPUFF PATCH in Audio.cpp) - not fetched.
